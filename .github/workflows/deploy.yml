name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write      # allow pushing commits/branches
  pages: write         # allow Pages deployment
  id-token: write      # required by some deployment flows

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # recommended for actions that create branches/tags
          persist-credentials: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./clients
